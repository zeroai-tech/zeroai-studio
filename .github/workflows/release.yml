name: Build installers

# Push a version tag (e.g. v0.2.1) → builds .dmg + .exe + .deb on each OS and
# attaches them to the GitHub Release for that tag. Or run manually to test
# (artifacts are downloadable from the run).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            legacy: dist:legacy:mac
          - os: windows-latest
            script: dist:win
            legacy: dist:legacy:win
          - os: ubuntu-latest
            script: dist:linux
            legacy: dist:legacy:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The desktop payload is one build of the hub, which lives in its own
      # (private) repo — scripts/bundle-hub.cjs expects it as a sibling
      # directory, exactly as it sits locally. HUB_TOKEN is a PAT with read
      # access to it; GITHUB_TOKEN cannot reach another repository.
      - uses: actions/checkout@v4
        with:
          repository: Lottie128/zeroai-studio-hub
          # APPS_PAT already exists and reads the Lottie128 app repos; keep it
          # as a fallback so this does not silently need a brand-new secret.
          token: ${{ secrets.HUB_TOKEN || secrets.APPS_PAT }}
          path: hub-checkout

      - name: Put the hub where bundle-hub.cjs looks for it
        shell: bash
        run: mv hub-checkout ../zeroai-studio-hub

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install the hub's dependencies
        shell: bash
        run: cd ../zeroai-studio-hub && bun install --frozen-lockfile

      - name: Provide shared config (public anon key)
        run: node scripts/fetch-config.cjs

      - run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.script }}

      # The offline edition was never built here. Every Legacy installer on
      # every release so far was produced on a laptop and uploaded by hand,
      # which is why a lesson added to the database could not reach a school
      # without someone remembering to do that. pack-legacy.cjs was always
      # scriptable; it simply had no caller in CI.
      # Pyodide is 196MB and gitignored in the hub, so a clean checkout does not
      # have it. Without this the offline edition builds with no Python at all,
      # which is the exact thing the hub's `legacy-carries-pyodide` invariant
      # exists to refuse. It is cached because re-downloading it on every job on
      # every release is minutes of nothing.
      - name: Cache vendored Pyodide
        uses: actions/cache@v4
        with:
          path: ../zeroai-studio-hub/public/pyodide
          key: pyodide-${{ hashFiles('../zeroai-studio-hub/build/vendorPyodide.mjs') }}

      - name: Vendor Pyodide into the hub
        shell: bash
        run: cd ../zeroai-studio-hub && bun run vendor:pyodide

      - name: Build the offline (Legacy) installer
        run: npm run ${{ matrix.legacy }}

      # Version-free copies so the website's download links survive a version
      # bump. See scripts/alias-artifacts.cjs for why this is load-bearing.
      - name: Write stable-named aliases
        run: node scripts/alias-artifacts.cjs

      - name: Upload build artifacts (downloadable from this run)
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: ignore

      - name: Attach to the GitHub Release (on a tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Installers are published to the PUBLIC releases repo so this source
          # repo can stay private. Requires a RELEASES_TOKEN secret (a PAT with
          # write access to zeroai-studio-releases) — GITHUB_TOKEN can't write
          # across repos.
          repository: zeroai-tech/zeroai-studio-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
